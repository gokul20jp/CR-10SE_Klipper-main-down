#CR-10 SE
########################################################
[custom_macro]
default_bed_temp: 60
default_extruder_temp: 220
g28_ext_temp: 140

# -------------------------------------------------------
# Calibration history — logs z_offset + mesh history to JSON.
# Copy klippy/extras/calibration_history.py to the printer's
# /usr/data/klipper/klippy/extras/ directory, then restart Klipper.
# -------------------------------------------------------
[calibration_history]

# -------------------------------------------------------
# Layer tracker — tracks per-layer timing and anomalies.
# Copy klippy/extras/layer_tracker.py to the printer's
# /usr/data/klipper/klippy/extras/ directory, then restart Klipper.
# -------------------------------------------------------
[layer_tracker]

# -------------------------------------------------------
# Load cell monitor — reference-only Z-offset logger.
# Records prtouch probe results at multiple temps/positions.
# Does NOT modify z_offset. View results in Fluidd.
# Copy klippy/extras/load_cell_monitor.py to the printer's
# /usr/share/klipper/klippy/extras/ directory, then restart Klipper.
# Run: LOAD_CELL_REFERENCE_CALIBRATION TEMP=140 BED_TEMP=60
# -------------------------------------------------------
[load_cell_monitor]
