# ─────────────────────────────────────────────────────────────────────────────
# LOAD_CELL_REFERENCE_CALIBRATION
# Reference-only Z-offset calibration at multiple temperatures and positions.
# Records data for analysis — does NOT change z_offset automatically.
#
# Usage:
#   LOAD_CELL_REFERENCE_CALIBRATION TEMP=140 BED_TEMP=60
#   LOAD_CELL_REFERENCE_CALIBRATION TEMP=200 BED_TEMP=60
#   LOAD_CELL_REFERENCE_CALIBRATION TEMP=240 BED_TEMP=60
#
# After running at all desired temps, view results in Fluidd Load Cell History tab.
# ─────────────────────────────────────────────────────────────────────────────
[gcode_macro LOAD_CELL_REFERENCE_CALIBRATION]
description: Reference Z-offset measurement at multiple positions and temperatures
gcode:
  {% set target_temp = params.TEMP|default(140)|int %}
  {% set bed_temp = params.BED_TEMP|default(60)|int %}
  {% set sample_count = params.SAMPLES|default(5)|int %}
  {% set note = params.NOTE|default("Reference calibration at %dC" % target_temp) %}

  # Probe positions: center + 4 quadrant positions
  {% set positions = [
    ('center',     110.0, 110.0),
    ('front_left',  30.0,  30.0),
    ('front_right',190.0,  30.0),
    ('rear_left',   30.0, 190.0),
    ('rear_right', 190.0, 190.0)
  ] %}

  RESPOND TYPE=echo MSG="=== Load Cell Reference Calibration ==="
  RESPOND TYPE=echo MSG="Target nozzle: {target_temp}°C | Bed: {bed_temp}°C | Samples per position: {sample_count}"
  RESPOND TYPE=echo MSG="NOTE: This is REFERENCE ONLY — z_offset will NOT be changed automatically"

  # Step 1: Heat bed first
  M190 S{bed_temp}
  RESPOND TYPE=echo MSG="Bed at temperature"

  # Step 2: Heat nozzle to print temp to purge, then cool to target for probing
  RESPOND TYPE=echo MSG="Heating nozzle to 200°C for purge..."
  M109 S200

  # Step 3: Purge filament to clean nozzle tip
  RESPOND TYPE=echo MSG="Purging filament to clean nozzle..."
  G28
  G90
  G1 X10 Y10 Z5 F6000
  G92 E0
  G1 E25 F180
  G92 E0
  # Retract filament up to avoid ooze during probing
  G1 E-80 F2000
  G92 E0
  RESPOND TYPE=echo MSG="Nozzle purged and filament retracted"

  # Step 4: Cool to target calibration temperature
  RESPOND TYPE=echo MSG="Cooling nozzle to {target_temp}°C for calibration..."
  M109 S{target_temp}
  G4 P5000

  # Step 5: Home all axes
  G28

  # Step 6: Start session
  LOAD_CELL_SESSION_START NOTE="{note}"

  # Step 7: Probe each position
  {% for pos_label, x, y in positions %}
    RESPOND TYPE=echo MSG="Probing at {pos_label} (X={x}, Y={y})"
    G90
    G1 X{x} Y{y} Z5 F6000
    G4 P1000

    LOAD_CELL_POSITION_START LABEL={pos_label} X={x} Y={y}

    {% for i in range(sample_count) %}
      RESPOND TYPE=echo MSG="  Sample {i+1}/{sample_count}..."
      Z_OFFSET_CALIBRATION
      # Read the z_offset that was just computed
      {% set z_val = printer['gcode_move'].homing_origin.z %}
      {% set adc_approx = 2800 %}
      LOAD_CELL_RECORD_SAMPLE Z={z_val} ADC={adc_approx}
      # Lift between samples
      G1 Z5 F600
      G4 P2000
    {% endfor %}

    LOAD_CELL_POSITION_END
  {% endfor %}

  # Step 8: Save session
  LOAD_CELL_SESSION_END

  # Step 9: Park and cool
  G1 X110 Y200 Z20 F6000
  M104 S0
  M140 S0
  RESPOND TYPE=echo MSG="=== Reference calibration complete. View results in Fluidd Load Cell History tab. ==="

[gcode_macro FINISH_INIT]
gcode:
  M204 S5000
  SET_PRESSURE_ADVANCE ADVANCE=0.04
  #转角速度：5mm/s
  SET_VELOCITY_LIMIT SQUARE_CORNER_VELOCITY=5
  #加速度：5000mm/s²
  M204 S5000
  #减速加速度：5000mm/s²
  SET_VELOCITY_LIMIT ACCEL_TO_DECEL=5000
  #移动速率：100%
  M220 S100
  #挤出流量：100%
  M221 S100

# ─────────────────────────────────────────────────────────────────────────────
# CHECK_MESH_POINTS
# Verify bed mesh compensation at 10 key points using a 0.05mm feeler gauge.
#
# Usage:
#   CHECK_MESH_POINTS
#   (optional) CHECK_MESH_POINTS NOZZLE_TEMP=220 BED_TEMP=60
#
# At each point, the nozzle lowers to gcode Z=0 with mesh applied.
# If mesh is correct, feeler drag should be identical at all 10 points.
#
# Results:
#   Same drag everywhere  → mesh is correct
#   Loose at a point      → mesh overcorrected there (or bad probe value)
#   Tight / no fit        → mesh undercorrected there (or bad probe value)
# ─────────────────────────────────────────────────────────────────────────────
[gcode_macro CHECK_MESH_POINTS_MANUALLY]
description: Verify bed mesh compensation at 10 points using feeler gauge
gcode:
  {% set nozzle_temp = params.NOZZLE_TEMP|default(240)|int %}
  {% set bed_temp    = params.BED_TEMP|default(60)|int %}

  RESPOND TYPE=echo MSG="CHECK_MESH_POINTS: heating bed to {bed_temp}C and nozzle to {nozzle_temp}C"
  M190 S{bed_temp}
  M109 S{nozzle_temp}

  RESPOND TYPE=echo MSG="CHECK_MESH_POINTS: homing and loading mesh"
  G28
  BED_MESH_PROFILE LOAD=default

  # ── Point 1: Center (110,110) — use this as your feeler baseline ──────────
  G1 Z5 F600
  G1 X110 Y110 F3000
  G1 Z0 F300
  M117 P1/10: Center (110,110) — set baseline drag here
  RESPOND TYPE=echo MSG="P1/10: Center (110,110) — mesh=-0.016mm — SET BASELINE DRAG HERE. Press Resume when done."
  M0

  # ── Point 2: Front-left (5,5) ─────────────────────────────────────────────
  G1 Z5 F600
  G1 X5 Y5 F3000
  G1 Z0 F300
  M117 P2/10: Front-left (5,5)
  RESPOND TYPE=echo MSG="P2/10: Front-left (5,5) — mesh=-0.080mm. Press Resume when done."
  M0

  # ── Point 3: Front-center (110,5) ────────────────────────────────────────
  G1 Z5 F600
  G1 X110 Y5 F3000
  G1 Z0 F300
  M117 P3/10: Front-center (110,5)
  RESPOND TYPE=echo MSG="P3/10: Front-center (110,5) — mesh=+0.001mm. Press Resume when done."
  M0

  # ── Point 4: Front-right (215,5) ─────────────────────────────────────────
  G1 Z5 F600
  G1 X215 Y5 F3000
  G1 Z0 F300
  M117 P4/10: Front-right (215,5)
  RESPOND TYPE=echo MSG="P4/10: Front-right (215,5) — mesh=+0.028mm. Press Resume when done."
  M0

  # ── Point 5: Mid-left (5,110) ────────────────────────────────────────────
  G1 Z5 F600
  G1 X5 Y110 F3000
  G1 Z0 F300
  M117 P5/10: Mid-left (5,110)
  RESPOND TYPE=echo MSG="P5/10: Mid-left (5,110) — mesh=-0.090mm. Press Resume when done."
  M0

  # ── Point 6: Mid-right (215,110) ─────────────────────────────────────────
  G1 Z5 F600
  G1 X215 Y110 F3000
  G1 Z0 F300
  M117 P6/10: Mid-right (215,110)
  RESPOND TYPE=echo MSG="P6/10: Mid-right (215,110) — mesh=+0.090mm. Press Resume when done."
  M0

  # ── Point 7: Back-left (5,215) ───────────────────────────────────────────
  G1 Z5 F600
  G1 X5 Y215 F3000
  G1 Z0 F300
  M117 P7/10: Back-left (5,215)
  RESPOND TYPE=echo MSG="P7/10: Back-left (5,215) — mesh=-0.129mm. Press Resume when done."
  M0

  # ── Point 8: Back-center (110,215) ───────────────────────────────────────
  G1 Z5 F600
  G1 X110 Y215 F3000
  G1 Z0 F300
  M117 P8/10: Back-center (110,215)
  RESPOND TYPE=echo MSG="P8/10: Back-center (110,215) — mesh=-0.001mm. Press Resume when done."
  M0

  # ── Point 9: Back-right (215,215) ────────────────────────────────────────
  G1 Z5 F600
  G1 X215 Y215 F3000
  G1 Z0 F300
  M117 P9/10: Back-right (215,215)
  RESPOND TYPE=echo MSG="P9/10: Back-right (215,215) — mesh=+0.158mm. Press Resume when done."
  M0

  # ── Point 10: Anomaly point (40,180) — suspected bad probe value ──────────
  G1 Z5 F600
  G1 X40 Y180 F3000
  G1 Z0 F300
  M117 P10/10: ANOMALY POINT (40,180) — watch this
