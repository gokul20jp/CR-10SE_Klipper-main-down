[gcode_macro G29]
# -------------------------------------------------------------------------
# G29 — Manual full calibration (alternative to PRINT_CALIBRATION)
# -------------------------------------------------------------------------
# PURPOSE:
#   Alternative calibration macro. Called manually from Fluidd terminal
#   or from slicers that use G29 in their start GCode.
#   Uses Z_OFFSET_AUTO (z_compensate_wrapper.so) — different from
#   CX_PRINT_LEVELING_CALIBRATION which uses Z_OFFSET_CALIBRATION.
#
# SEQUENCE:
#   1. G28             — home all axes
#   2. Z_OFFSET_AUTO   — compute z_offset (nozzle-touch + BLTouch fusion)
#                        uses z_compensate_wrapper.so
#                        NO nozzle wipe/clean step
#   3. G28 Z           — re-home Z with new z_offset
#   4. BED_MESH_CALIBRATE — full 49-point mesh probe
#   5. CXSAVE_CONFIG   — save z_offset + mesh to disk
#
# NO NOZZLE CLEAN:
#   Unlike CX_PRINT_LEVELING_CALIBRATION, G29 has NO nozzle cleaning step.
#
# IF ADDING SILICON BRUSH:
#   Add your brush macro AFTER G28 and BEFORE Z_OFFSET_AUTO:
#     G28
#     CLEAN_NOZZLE      ← add your brush macro here
#     Z_OFFSET_AUTO
#     ...
# -------------------------------------------------------------------------
gcode:
  M204 S5000
  G90
  SOFT_CHECK_ERROR FLAG=0
  G28
  # SOFT_CHECK_ERROR FLAG=0
  # NOTE: No nozzle clean here. If adding silicon brush, add CLEAN_NOZZLE macro here.
  Z_OFFSET_AUTO
  M104S0
  M107
  G28 Z
  BED_MESH_CALIBRATE
  G1 X110Y110Z10
  M140S0
  CXSAVE_CONFIG
  CALIBRATION_HISTORY_LOG TRIGGER=G29 NOTE="Auto calibration via G29"


 
[gcode_macro INPUTSHAPER]
gcode:
  G90
  {% if 'X' in params.AXES|upper %}
    {action_respond_info("INPUTSHAPER: calibrating X axis — disabling motors, then homing")}
    M84
    G28
    SHAPER_CALIBRATE AXIS=X
  {% elif 'Y' in params.AXES|upper %}
    {action_respond_info("INPUTSHAPER: calibrating Y axis")}
    {% if "xyz" not in printer.toolhead.homed_axes %}
      {action_respond_info("INPUTSHAPER: printer not homed — running G28")}
      G28
    {% endif %}
    SHAPER_CALIBRATE AXIS=Y
  {% else %}
    {action_respond_info("INPUTSHAPER: calibrating both axes (X+Y)")}
    SHAPER_CALIBRATE
  {% endif %}
  CXSAVE_CONFIG



